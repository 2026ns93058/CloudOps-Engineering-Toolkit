apiVersion: apps/v1
kind: Deployment
metadata:
  name: default-replicas
spec:
  selector:
    matchLabels:
      app: default-replicas
  template:
    metadata:
      labels:
        app: default-replicas
    spec:
      containers:
      - name: app
        image: nginx:1.27
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          runAsNonRoot: true
        readinessProbe:
          tcpSocket:
            port: 80
        livenessProbe:
          tcpSocket:
            port: 80
